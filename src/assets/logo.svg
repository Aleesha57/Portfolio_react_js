  <!-- Decorative circle -->
  <circle cx="80" cy="80" r="40" fill="#8a2be2" opacity="0.6"/>
  <circle cx="520" cy="180" r="30" fill="#8a2be2" opacity="0.4"/>

  <!-- Decorative triangles -->
